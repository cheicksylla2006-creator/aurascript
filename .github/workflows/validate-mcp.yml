name: Validate MCP extension

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check server/aura-mcp.js
      - name: Validate extension manifests
        run: |
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('gemini-extension.json','utf8')); if (m.name !== 'aurascript') throw new Error('Unexpected extension name'); if (!m.mcpServers?.['aura-script']) throw new Error('Missing MCP server'); if (!fs.existsSync('server/aura-mcp.js')) throw new Error('MCP server file missing'); if (!fs.existsSync(m.contextFileName)) throw new Error('Context file missing'); JSON.parse(fs.readFileSync('.claude-plugin/plugin.json','utf8')); JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json','utf8')); console.log('Manifests OK');"
      - name: Run MCP stdio smoke test
        run: node --test tests/*.test.js

  gemini-cli-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Gemini CLI
        run: npm install --global @google/gemini-cli@latest
      - name: Link extension and verify Gemini CLI registration
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/gemini-home"
          export GEMINI_CLI_TRUST_WORKSPACE=true
          mkdir -p "$HOME"
          gemini --version
          timeout 90s gemini extensions install "$GITHUB_WORKSPACE" --consent --skip-settings
          cd "$RUNNER_TEMP"
          output="$(timeout 60s gemini extensions list 2>&1)"
          printf '%s\n' "$output"
          printf '%s' "$output" | grep -qi 'aurascript'
          test -f "$HOME/.gemini/extensions/aurascript/gemini-extension.json"
